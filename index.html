<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Para Abril</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,500;1,300;1,500&family=Nunito:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#07141c;--sea:#0f2c3a;--foam:#cfe6e3;--sand:#efe6d4;--rose:#d9a3b6}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:linear-gradient(180deg,var(--ink) 0%,var(--sea) 45%,#14384a 70%,var(--ink) 100%);color:var(--sand);font-family:'Cormorant Garamond',Georgia,serif;font-size:1.35rem;line-height:1.6;overflow-x:hidden}
section{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:12vh 1.4rem}

/* Portada */
#hero{text-align:center;position:relative;min-height:100vh}
#hero h1{font-weight:300;font-size:clamp(3rem,12vw,7rem);letter-spacing:.02em;line-height:1.05;opacity:0;animation:rise 2.4s .3s forwards}
#hero p{font-style:italic;color:var(--foam);margin:1.4rem 0 2.4rem;opacity:0;animation:rise 2.4s 1.4s forwards}
#enter{font:600 1rem 'Nunito',sans-serif;color:var(--ink);background:var(--sand);border:0;border-radius:99px;padding:.9rem 2rem;cursor:pointer;opacity:0;animation:rise 2s 2.6s forwards;transition:transform .3s,background .3s}
#enter:hover{transform:scale(1.05);background:var(--foam)}
#hero small{display:block;margin-top:1rem;font:400 .85rem 'Nunito',sans-serif;color:var(--foam);opacity:0;animation:rise 2s 3s forwards}
.waves{position:absolute;left:0;bottom:0;width:200%;height:90px;opacity:.5;animation:drift 14s linear infinite}
.waves.b{opacity:.25;bottom:12px;animation-duration:22s;animation-direction:reverse}
@keyframes drift{to{transform:translateX(-50%)}}
@keyframes rise{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}

/* Chat */
#chat-sec h2{font-weight:300;font-style:italic;font-size:1.6rem;color:var(--foam);margin-bottom:2rem;text-align:center}
.phone{width:100%;max-width:420px;background:rgba(7,20,28,.55);border:1px solid rgba(207,230,227,.18);border-radius:28px;padding:1.2rem;backdrop-filter:blur(6px);min-height:380px;display:flex;flex-direction:column;gap:.7rem}
.who{font:600 .8rem 'Nunito',sans-serif;color:var(--foam);text-align:center;padding-bottom:.6rem;border-bottom:1px solid rgba(207,230,227,.12)}
.msg{max-width:82%;padding:.7rem 1rem;border-radius:20px;font:400 1rem/1.45 'Nunito',sans-serif;animation:pop .5s cubic-bezier(.2,1.4,.4,1)}
.msg.a{align-self:flex-start;background:var(--rose);color:var(--ink);border-bottom-left-radius:6px}
.msg.m{align-self:flex-end;background:var(--foam);color:var(--ink);border-bottom-right-radius:6px}
.msg b{display:block;font-size:.72rem;opacity:.65;margin-bottom:.15rem}
.typing{align-self:flex-start;display:flex;gap:5px;padding:.8rem 1rem;background:rgba(207,230,227,.15);border-radius:20px}
.typing.m{align-self:flex-end}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--foam);animation:blink 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
@keyframes pop{from{opacity:0;transform:scale(.8) translateY(12px)}to{opacity:1;transform:none}}

/* Poema */
#poem{align-items:flex-start;max-width:760px;margin:0 auto;display:block;min-height:0}
.v{opacity:0;transform:translateY(30px);filter:blur(6px);transition:opacity 1.6s ease,transform 1.6s ease,filter 1.6s ease;margin:0 0 2.6rem}
.v.in{opacity:1;transform:none;filter:none}
.intro{font-size:1.5rem;color:var(--foam)}
.ref{font-size:clamp(1.5rem,4.4vw,2.2rem);font-weight:300;line-height:1.35}
.ref span{font-style:italic;color:var(--rose);margin-right:.35em}
.big{font-size:clamp(2rem,7vw,3.6rem);font-weight:500;font-style:italic;text-align:center;color:var(--sand);margin:6rem 0 4rem}
.end{text-align:center;color:var(--foam);font-style:italic}

/* Foto */
#photo{min-height:100vh}
#photo figure{opacity:0;transform:scale(.94);transition:opacity 2.4s ease,transform 2.4s ease}
#photo figure.in{opacity:1;transform:none}
#photo img{display:block;width:min(88vw,420px);border-radius:200px 200px 24px 24px;box-shadow:0 0 80px rgba(217,163,182,.25)}
#photo p{text-align:center;margin-top:2rem;font-style:italic;color:var(--foam)}

/* Sonido */
#snd{position:fixed;top:14px;right:14px;z-index:9;font:600 .85rem 'Nunito',sans-serif;background:rgba(7,20,28,.7);color:var(--foam);border:1px solid rgba(207,230,227,.3);border-radius:99px;padding:.5rem 1rem;cursor:pointer;display:none}
#yt{position:fixed;left:-9999px;width:200px;height:200px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition-duration:.01s!important}}
</style>
</head>
<body>

<button id="snd" aria-label="Activar o silenciar sonido">Sonido: sí</button>
<div id="yt"></div>

<section id="hero">
  <h1>Para Abril</h1>
  <p>Algo que me quedó dando vueltas desde que me preguntaste.</p>
  <button id="enter">Entrar</button>
  <small>Con sonido de mar de fondo</small>
  <svg class="waves" viewBox="0 0 1200 90" preserveAspectRatio="none"><path fill="#cfe6e3" d="M0 45 Q150 0 300 45 T600 45 T900 45 T1200 45 V90 H0Z"/></svg>
  <svg class="waves b" viewBox="0 0 1200 90" preserveAspectRatio="none"><path fill="#d9a3b6" d="M0 50 Q150 90 300 50 T600 50 T900 50 T1200 50 V90 H0Z"/></svg>
</section>

<section id="chat-sec">
  <h2>Todo empezó con esto</h2>
  <div class="phone" id="phone"><div class="who">Abril y Matias</div></div>
</section>

<section id="poem"></section>

<section id="photo">
  <figure id="fig">
    <img src="foto.jpg" alt="Una foto nuestra, movida y riéndonos">
    <p>Y a esto también.</p>
  </figure>
</section>

<script>
/* ---------- Sonido (YouTube oculto) ---------- */
let player, ready = false, playing = false, wantPlay = false;
const tag = document.createElement('script');
tag.src = 'https://www.youtube.com/iframe_api';
document.head.appendChild(tag);
window.onYouTubeIframeAPIReady = () => {
  player = new YT.Player('yt', {
    height: '200', width: '200', videoId: 'B1T06UhcX0Q',
    playerVars: { loop: 1, playlist: 'B1T06UhcX0Q', controls: 0, playsinline: 1 },
    events: { onReady: () => { ready = true; player.setVolume(60); if (wantPlay) startSound(); } }
  });
};
function startSound(){ wantPlay = true; if (ready){ player.playVideo(); playing = true; setBtn(); } }
function setBtn(){ document.getElementById('snd').textContent = 'Sonido: ' + (playing ? 'sí' : 'no'); }
document.getElementById('snd').onclick = () => {
  if (!ready) return;
  playing ? player.pauseVideo() : player.playVideo();
  playing = !playing; setBtn();
};

document.getElementById('enter').onclick = () => {
  startSound();
  document.getElementById('snd').style.display = 'block';
  document.getElementById('chat-sec').scrollIntoView({behavior:'smooth'});
};

/* ---------- Chat ---------- */
const chat = [
  ['a','Abril','¿Cuál es tu sueño?'],
  ['m','Matias','Estar tranquilo.'],
  ['a','Abril','Te digo en serio, ¿qué buscás en la vida?'],
  ['m','Matias','Vivir tranquilo. Plenamente tranquilo.']
];
const wait = ms => new Promise(r => setTimeout(r, ms));
let chatStarted = false;
async function playChat(){
  const phone = document.getElementById('phone');
  for (const [side, name, text] of chat){
    const t = document.createElement('div');
    t.className = 'typing ' + side;
    t.innerHTML = '<i></i><i></i><i></i>';
    phone.appendChild(t);
    await wait(1300);
    t.remove();
    const m = document.createElement('div');
    m.className = 'msg ' + side;
    m.innerHTML = '<b>' + name + '</b>' + text;
    phone.appendChild(m);
    await wait(900);
  }
}
new IntersectionObserver((es, o) => {
  if (es[0].isIntersecting && !chatStarted){ chatStarted = true; playChat(); o.disconnect(); }
}, {threshold: .5}).observe(document.getElementById('phone'));

/* ---------- Poema ---------- */
const intro = [
  'Cuando me hiciste esta pregunta, no pude dejar de pensar en mi respuesta.',
  'Sí, mi sueño es vivir tranquilo, pero quizás siento que no me expliqué muy bien, o no desarrollé lo suficiente.',
  'El nivel de tranquilidad por el cual sueño en paz, a eso me refería.',
  'Para que entiendas, me refiero a...'
];
const refs = [
  'pasar meses sin discutir con vos,',
  'ir en nuestro auto viajando por capital y cuando estemos en un semáforo, mirar por las ventanas los rascacielos tomados de la mano,',
  'tener una familia en donde el problema más pesado y común que tengamos sea "¿a dónde salimos esta semana?",',
  'ver a las gatas crecer sanas y gorditas con todas las chucherías que siempre quisiste darles,',
  'no tener que preocuparnos por la hora en la que vamos a dormir, y la hora en la que nos despertemos,',
  'que el ambiente donde estemos nos permita salir a la madrugada a caminar mirando el cielo,',
  'poder dar el primer paso sin duda ni miedo alguno,',
  'viajar juntos por el mundo,',
  'hacer arte,',
  'reunirnos con las personas importantes para nosotros en nuestra familia y decirles que ya está, esto es suyo, no trabajen más,',
  'no tener la capacidad de sobrepensar nunca más,',
  'mirarme al espejo y no sentir pena,',
  'ir costeando el mar sobre la calle con música de playa, juntos,',
  'amarte más,',
  'crecer toda la vida juntos,',
  'poder llorar sin miedo al lado tuyo,',
  'ya de viejos, mirarnos a los ojos y abrazarnos por última vez para no despertar nunca más y trascender a una nueva vida juntos,',
  'mirar para atrás y dejar de sentir asco por mis acciones del pasado,',
  'verte a la cara y llorar por el simple hecho de verte, de que me permitas verte,',
  'volver a estar conectados,',
  'idearme cosas para regalarte,',
  'ser una persona empática y amable,',
  'no tener que preocuparme nunca más por la plata,',
  'darte paz,'
];
const poem = document.getElementById('poem');
function add(cls, html){
  const d = document.createElement('p');
  d.className = 'v ' + cls; d.innerHTML = html; poem.appendChild(d);
}
intro.forEach(t => add('intro', t));
refs.forEach(t => add('ref', '<span>me refiero a</span>' + t));
add('big', 'me refiero a vos,<br>por sobre todo hoy y para siempre<br>como mi amorcito.');
add('end', 'A esa tranquilidad me refiero.');
add('end', 'Capaz soy un pretencioso, pero ese es mi sueño.');

const io = new IntersectionObserver(es => es.forEach(e => {
  if (e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target); }
}), {threshold: .35});
document.querySelectorAll('.v, #fig').forEach(el => io.observe(el));
</script>
</body>
</html>
